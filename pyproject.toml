[project]
name = "apiaprendiz"
version = "0.1.0"
description = "DealHunter — monitor de preços de jogos (Steam, Epic, GOG e outras)"
readme = "README.md"
authors = [
    { name = "Raphaeldaysc", email = "raphaelcamara.rc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "streamlit>=1.39.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[project.scripts]
apiaprendiz = "apiaprendiz:main"
dealhunter = "apiaprendiz:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
