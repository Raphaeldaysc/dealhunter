[project]
name = "dealhunter"
version = "0.1.0"
description = "DealHunter — rastreador de preços de jogos em múltiplas lojas, com normalização em BRL e alertas"
readme = "README.md"
authors = [
    { name = "Raphael Dias", email = "raphaelcamara.rc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "streamlit>=1.39.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[project.scripts]
dealhunter = "dealhunter:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
